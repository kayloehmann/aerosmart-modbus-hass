when:
  - event: [pull_request, push]
    branch: main

clone:
  git:
    image: woodpeckerci/plugin-git:2.12.1@sha256:b8d2401997be68ec25d62bd753fe5d30236e029fe007a5e823177e0e485ae205
    settings:
      depth: 0
      partial: false
      tags: true
      lfs: false
      recursive: false

steps:
  gitleaks:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    commands:
      - gitleaks git --redact --log-opts="--full-history --diff-merges=first-parent HEAD" .

  quality:
    image: python:3.14-slim@sha256:f57c4c23b985d95deea5bc5249e2f9c8a512b4cc9d5d3fd31900cbd2f5f0a604
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends git
      - python -m pip install --disable-pip-version-check -r requirements_test.txt
      - python -m pip install --disable-pip-version-check -r requirements.txt
      - python -m ruff check .
      - python -m ruff format --check .
      - python -m pytest tests --verbose
