name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  pytest:
    name: "pytest (Python 3.14)"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install requirements
        run: |
          python3 -m pip install -r requirements_test.txt
          # Replace the helper's 2026.9 beta pin with the released HA version.
          python3 -m pip install -r requirements.txt

      - name: Run tests
        run: python3 -m pytest tests --verbose
